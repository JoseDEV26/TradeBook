<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeBook PRO</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#080c14;color:#e2e8f0;font-family:'Sora',sans-serif;margin:0}
.container{max-width:1100px;margin:auto;padding:30px}
.card{background:#0f1623;border:1px solid #1e2d45;border-radius:14px;padding:24px;margin-bottom:20px}
input,button,select{padding:10px;border-radius:8px;border:1px solid #1e2d45;background:#161e2e;color:#e2e8f0}
button{cursor:pointer;background:#00e5a0;color:#000;font-weight:700}
button.secondary{background:#161e2e;color:#e2e8f0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left}
thead{border-bottom:1px solid #1e2d45}
tr:hover{background:#161e2e}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#0f1623;border:1px solid #1e2d45;border-radius:12px;padding:18px}
.stat b{font-size:20px}
</style>
</head>
<body>
<div class="container">

<h1>TradeBook PRO</h1>

<div class="statgrid">
<div class="stat">Trades<br><b id="statTrades">0</b></div>
<div class="stat">Lucro Total<br><b id="statLucro">R$0</b></div>
<div class="stat">Win Rate<br><b id="statWin">0%</b></div>
<div class="stat">Melhor Trade<br><b id="statBest">-</b></div>
</div>

<div class="card">
<h3>Novo Trade</h3>
<input id="ticker" placeholder="Ticker">
<input id="qtd" type="number" placeholder="Qtd">
<input id="buy" type="number" placeholder="Compra">
<input id="sell" type="number" placeholder="Venda">
<input id="date" type="date">
<button onclick="addTrade()">Adicionar</button>
</div>

<div class="card">
<h3>Filtro</h3>
<input id="filter" placeholder="Filtrar ticker" oninput="render()">
<button class="secondary" onclick="exportCSV()">Exportar CSV</button>
</div>

<div class="card">
<h3>Performance</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>Histórico</h3>
<table>
<thead>
<tr>
<th>Ação</th>
<th>Qtd</th>
<th>Compra</th>
<th>Venda</th>
<th>Lucro</th>
<th>Data</th>
<th></th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>
const SUPABASE_URL="https://dljcfstztkkhqyujimsn.supabase.co";
const SUPABASE_KEY="sb_publishable_Ya3ldgqJUxAsowyemytKWQ_xOQi83Jm";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let trades=[];
let chart;

async function load(){
const {data}=await sb.from('operacoes').select('*').order('data');
trades=data||[];
render();
}

async function addTrade(){
const ticker=document.getElementById('ticker').value.toUpperCase();
const quantidade=parseFloat(qtd.value);
const preco_compra=parseFloat(buy.value);
const preco_venda=parseFloat(sell.value);
const data=date.value;

await sb.from('operacoes').insert({ticker,quantidade,preco_compra,preco_venda,data});

load();
}

function lucro(t){
return (t.preco_venda-t.preco_compra)*t.quantidade;
}

function render(){
const filter=document.getElementById('filter').value.toUpperCase();
const body=document.getElementById('table');

let list=trades.filter(t=>t.ticker.includes(filter));

body.innerHTML=list.map(t=>{
let l=lucro(t);
return `<tr>
<td>${t.ticker}</td>
<td>${t.quantidade}</td>
<td>${t.preco_compra}</td>
<td>${t.preco_venda}</td>
<td>${l.toFixed(2)}</td>
<td>${t.data}</td>
<td><button onclick="del('${t.id}')">X</button></td>
</tr>`;
}).join('');

stats(list);
chartRender(list);
}

function stats(list){
let total=0,wins=0,best=null;
list.forEach(t=>{
let l=lucro(t);
if(l>0)wins++;
if(!best||l>best)best=l;
 total+=l;
});

statTrades.textContent=list.length;
statLucro.textContent="R$"+total.toFixed(2);
statWin.textContent=list.length?Math.round((wins/list.length)*100)+"%":"0%";
statBest.textContent=best?"R$"+best.toFixed(2):"-";
}

function chartRender(list){
let cum=0;
let labels=[];
let data=[];

list.forEach(t=>{
 cum+=lucro(t);
 labels.push(t.data);
 data.push(cum);
});

if(chart)chart.destroy();

chart=new Chart(document.getElementById('chart'),{
 type:'line',
 data:{labels,datasets:[{label:'Equity',data}]}
});
}

async function del(id){
await sb.from('operacoes').delete().eq('id',id);
load();
}

function exportCSV(){
let rows=["ticker,qtd,compra,venda,data"];
trades.forEach(t=>{
rows.push(`${t.ticker},${t.quantidade},${t.preco_compra},${t.preco_venda},${t.data}`);
});

let blob=new Blob([rows.join("\n")]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="trades.csv";
a.click();
}

load();
</script>
</body>
</html>
