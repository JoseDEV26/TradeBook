<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TradeBook</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
--bg:#080c14;
--surface:#0f1623;
--surface2:#161e2e;
--border:#1e2d45;
--accent:#00e5a0;
--accent2:#0ea5e9;
--red:#f43f5e;
--text:#e2e8f0;
--muted:#64748b;
--radius:14px;
}

body{
background:var(--bg);
color:var(--text);
font-family:'Sora',sans-serif;
margin:0;
}

.stats{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:16px;
margin-bottom:30px;
}

.stat-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--radius);
padding:20px;
}

.stat-label{
font-size:11px;
color:var(--muted);
text-transform:uppercase;
margin-bottom:10px;
}

.stat-value{
font-family:'DM Mono',monospace;
font-size:20px;
}

.green{color:var(--accent)}
.red{color:var(--red)}

</style>

</head>

<body>

<div class="stats">

<div class="stat-card">
<div class="stat-label">Total Operações</div>
<div class="stat-value" id="total-ops">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Lucro Total</div>
<div class="stat-value" id="lucro-total">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Lucrativas</div>
<div class="stat-value green" id="ops-pos">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Melhor Trade</div>
<div class="stat-value green" id="melhor-trade">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Winrate</div>
<div class="stat-value" id="winrate">—</div>
</div>

<div class="stat-card">
<div class="stat-label">Média por Trade</div>
<div class="stat-value" id="media-trade">—</div>
</div>

</div>

<script>

function fmt(v){
const abs=Math.abs(v).toFixed(2).replace('.',',')
return (v<0?'-':'')+'R$ '+abs
}

function renderizar(ops){

let lucroTotal=0
let opsPos=0
let melhor=null

ops.forEach(op=>{

const lucro=(op.preco_venda-op.preco_compra)*op.quantidade

lucroTotal+=lucro

if(lucro>0)opsPos++

if(!melhor||lucro>melhor.lucro){
melhor={ticker:op.ticker,lucro}
}

})

const winrate=ops.length?((opsPos/ops.length)*100).toFixed(1):0
const mediaTrade=ops.length?(lucroTotal/ops.length):0

document.getElementById("total-ops").textContent=ops.length
document.getElementById("ops-pos").textContent=opsPos

document.getElementById("lucro-total").textContent=fmt(lucroTotal)

document.getElementById("winrate").textContent=winrate+"%"
document.getElementById("media-trade").textContent=fmt(mediaTrade)

if(melhor){
document.getElementById("melhor-trade").textContent=
melhor.ticker+" "+fmt(melhor.lucro)
}

}

function changeTheme(theme){

const root=document.documentElement

const themes={

green:{accent:"#00e5a0",accent2:"#0ea5e9"},
blue:{accent:"#3b82f6",accent2:"#06b6d4"},
purple:{accent:"#8b5cf6",accent2:"#ec4899"},
gold:{accent:"#f59e0b",accent2:"#fbbf24"},
red:{accent:"#ef4444",accent2:"#f43f5e"}

}

if(!themes[theme])return

root.style.setProperty("--accent",themes[theme].accent)
root.style.setProperty("--accent2",themes[theme].accent2)

localStorage.setItem("tradebook-theme",theme)

}

const savedTheme=localStorage.getItem("tradebook-theme")

if(savedTheme){
changeTheme(savedTheme)
}

</script>

</body>
</html>
