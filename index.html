<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeBook</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #080c14;
    --surface: #0f1623;
    --surface2: #161e2e;
    --border: #1e2d45;
    --accent: #00e5a0;
    --accent2: #0ea5e9;
    --red: #f43f5e;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Sora', sans-serif; min-height: 100vh; }
  .glow-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 10%, rgba(0,229,160,0.05) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 80% 80%, rgba(14,165,233,0.05) 0%, transparent 70%);
  }

  /* AUTH */
  #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 420px; position: relative; overflow: hidden; }
  .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .auth-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
  .auth-logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 8px 32px rgba(0,229,160,0.25); }
  .auth-logo h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .auth-logo h1 span { color: var(--accent); }
  .auth-logo p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .auth-tabs { display: flex; background: var(--surface2); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
  .auth-tab { flex: 1; padding: 9px; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 8px; transition: all 0.2s; border: none; background: none; font-family: 'Sora', sans-serif; }
  .auth-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .auth-field input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Sora', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  .auth-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,160,0.1); }
  .btn-auth { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), #00c47e); border: none; border-radius: 10px; color: #080c14; font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 20px rgba(0,229,160,0.3); }
  .btn-auth:hover { opacity: 0.9; transform: translateY(-1px); }
  .auth-msg { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
  .auth-error { background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); color: var(--red); }
  .auth-success { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); color: var(--accent); }

  /* APP */
  #app-screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .topbar { background: rgba(15,22,35,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-logo { display: flex; align-items: center; gap: 10px; }
  .topbar-logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .topbar-logo h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .topbar-logo h1 span { color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-pill { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px 6px 8px; font-size: 12px; color: var(--muted); }
  .user-avatar { width: 26px; height: 26px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #080c14; }
  .btn-logout { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; color: var(--muted); font-family: 'Sora', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }
  .main { max-width: 1000px; margin: 0 auto; padding: 36px 24px; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; position: relative; overflow: hidden; transition: border-color 0.2s; }
  .stat-card:hover { border-color: rgba(0,229,160,0.2); }
  .stat-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .stat-value { font-family: 'DM Mono', monospace; font-size: 21px; font-weight: 500; }
  .stat-value.green { color: var(--accent); }
  .stat-value.red { color: var(--red); }

  /* PANEL */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }
  .panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 22px; }
  .form-grid { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 12px; align-items: end; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .field input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,160,0.08); }
  .field input::placeholder { color: var(--muted); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #00c47e); border: none; border-radius: 8px; padding: 10px 22px; color: #080c14; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 16px rgba(0,229,160,0.2); }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 0 12px 14px; font-weight: 500; }
  tbody tr { border-bottom: 1px solid rgba(30,45,69,0.5); transition: background 0.15s; }
  tbody tr:hover { background: var(--surface2); }
  td { padding: 14px 12px; font-size: 14px; font-family: 'DM Mono', monospace; }
  td.ticker { font-weight: 500; color: var(--accent2); letter-spacing: 1.5px; font-size: 13px; }
  .ticker-wrap { display: flex; align-items: center; gap: 10px; }
  .ticker-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--accent2); overflow: hidden; flex-shrink: 0; }
  .ticker-logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  td.lucro-pos { color: var(--accent); }
  td.lucro-neg { color: var(--red); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-family: 'Sora', sans-serif; font-weight: 600; }
  .badge.pos { background: rgba(0,229,160,0.1); color: var(--accent); }
  .badge.neg { background: rgba(244,63,94,0.1); color: var(--red); }
  .btn-del { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; color: var(--muted); cursor: pointer; font-size: 12px; transition: all 0.2s; }
  .btn-del:hover { border-color: var(--red); color: var(--red); background: rgba(244,63,94,0.05); }
  .empty { text-align: center; padding: 56px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* TOAST */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 20px; font-size: 13px; color: var(--accent); transform: translateY(80px); opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .toast.show { transform: translateY(0); opacity: 1; }
  .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,229,160,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 750px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .topbar { padding: 0 16px; }
    .main { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="glow-bg"></div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">📒</div>
      <div>
        <h1>Trade<span>Book</span></h1>
        <p>Seu diário de operações na B3</p>
      </div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="setTab('login')">Entrar</button>
      <button class="auth-tab" onclick="setTab('signup')">Criar conta</button>
    </div>
    <div id="auth-error" class="auth-msg auth-error"></div>
    <div id="auth-success" class="auth-msg auth-success"></div>
    <div class="auth-field">
      <label>Email</label>
      <input id="auth-email" type="email" placeholder="seu@email.com">
    </div>
    <div class="auth-field">
      <label>Senha</label>
      <input id="auth-password" type="password" placeholder="••••••••">
    </div>
    <button class="btn-auth" id="btn-auth" onclick="handleAuth()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-icon">📒</div>
      <h1>Trade<span>Book</span></h1>
    </div>
    <div class="topbar-right">
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-email-display">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Total Operações</div><div class="stat-value" id="total-ops">—</div></div>
      <div class="stat-card"><div class="stat-label">Lucro Total</div><div class="stat-value" id="lucro-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Lucrativas</div><div class="stat-value green" id="ops-pos">—</div></div>
      <div class="stat-card"><div class="stat-label">Melhor Trade</div><div class="stat-value green" id="melhor-trade">—</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">Nova Operação</div>
      <div class="form-grid">
        <div class="field"><label>Ticker</label><input id="ticker" type="text" placeholder="PETR4" maxlength="7"></div>
        <div class="field"><label>Qtd. Ações</label><input id="qtd" type="number" placeholder="100" min="1"></div>
        <div class="field"><label>Preço Compra</label><input id="preco-compra" type="number" placeholder="32.50" step="0.01"></div>
        <div class="field"><label>Preço Venda</label><input id="preco-venda" type="number" placeholder="35.80" step="0.01"></div>
        <div class="field"><label>Data</label><input id="data" type="date"></div>
        <button class="btn-primary" onclick="adicionarOp()" id="btn-adicionar">+ Adicionar</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Histórico de Operações</div>
      <table>
        <thead>
          <tr>
            <th>Ação</th><th>Qtd.</th><th>Compra</th><th>Venda</th>
            <th>Lucro / Prejuízo</th><th>Resultado</th><th>Data</th><th></th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dljcfstztkkhqyujimsn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ya3ldgqJUxAsowyemytKWQ_xOQi83Jm';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let authMode = 'login';

function getLogoUrl(ticker) {
  return `https://raw.githubusercontent.com/thefintz/icones-b3/main/icones/${ticker.toUpperCase()}.png`;
}

function tickerLogoHTML(ticker) {
  const initials = ticker.replace(/[0-9]/g, '').substring(0, 2);
  return `<div class="ticker-wrap">
    <div class="ticker-logo" id="logo-${ticker}">
      <img src="${getLogoUrl(ticker)}" alt="${ticker}"
        onload="this.parentNode.style.background='#fff'"
        onerror="this.style.display='none';this.parentNode.textContent='${initials}'">
    </div>
    <span>${ticker}</span>
  </div>`;
}

function setTab(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (i===0&&mode==='login')||(i===1&&mode==='signup'));
  });
  document.getElementById('btn-auth').textContent = mode==='login' ? 'Entrar' : 'Criar conta';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-success').style.display = 'none';
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const sucEl = document.getElementById('auth-success');
  const btn = document.getElementById('btn-auth');

  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!email || !password) {
    errEl.textContent = 'Preencha email e senha.';
    errEl.style.display = 'block'; return;
  }

  btn.innerHTML = '<span class="loading"></span> Aguarde...';
  btn.disabled = true;

  if (authMode === 'login') {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = 'Email ou senha incorretos.';
      errEl.style.display = 'block';
    } else { entrarNoApp(data.user); }
  } else {
    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
    } else {
      sucEl.textContent = '✅ Conta criada! Verifique seu email para confirmar e depois faça login.';
      sucEl.style.display = 'block';
    }
  }

  btn.textContent = authMode==='login' ? 'Entrar' : 'Criar conta';
  btn.disabled = false;
}

async function logout() {
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

function entrarNoApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  const emailShort = user.email.split('@')[0];
  document.getElementById('user-email-display').textContent = user.email;
  document.getElementById('user-avatar').textContent = emailShort[0].toUpperCase();
  document.getElementById('data').valueAsDate = new Date();
  carregarOperacoes();
}

async function carregarOperacoes() {
  const { data, error } = await sb.from('operacoes').select('*').order('criado_em', { ascending: false });
  if (error) { mostrarToast('❌ Erro ao carregar'); return; }
  renderizar(data || []);
}

async function adicionarOp() {
  const ticker = document.getElementById('ticker').value.trim().toUpperCase();
  const qtd = parseFloat(document.getElementById('qtd').value);
  const compra = parseFloat(document.getElementById('preco-compra').value);
  const venda = parseFloat(document.getElementById('preco-venda').value);
  const data = document.getElementById('data').value;

  if (!ticker || !qtd || !compra || !venda || !data) {
    mostrarToast('⚠️ Preencha todos os campos!'); return;
  }

  const btn = document.getElementById('btn-adicionar');
  btn.innerHTML = '<span class="loading"></span>';
  btn.disabled = true;

  const { error } = await sb.from('operacoes').insert({
    user_id: currentUser.id, ticker,
    quantidade: qtd, preco_compra: compra, preco_venda: venda, data
  });

  btn.innerHTML = '+ Adicionar';
  btn.disabled = false;

  if (error) { mostrarToast('❌ Erro ao salvar: ' + error.message); return; }

  mostrarToast('✅ Salvo na nuvem!');
  document.getElementById('ticker').value = '';
  document.getElementById('qtd').value = '';
  document.getElementById('preco-compra').value = '';
  document.getElementById('preco-venda').value = '';
  document.getElementById('ticker').focus();
  carregarOperacoes();
}

async function remover(id) {
  if (!confirm('Remover esta operação?')) return;
  const { error } = await sb.from('operacoes').delete().eq('id', id);
  if (error) { mostrarToast('❌ Erro ao remover.'); return; }
  mostrarToast('🗑 Removido.');
  carregarOperacoes();
}

function fmt(v) {
  const abs = Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (v < 0 ? '-' : '') + 'R$ ' + abs;
}

function renderizar(ops) {
  const tbody = document.getElementById('tabela-body');
  if (ops.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="empty-icon">📋</div>Nenhuma operação ainda.<br><small style="color:var(--muted);display:block;margin-top:6px">Adicione sua primeira operação acima!</small></div></td></tr>';
    document.getElementById('total-ops').textContent = '0';
    document.getElementById('lucro-total').textContent = 'R$ 0,00';
    document.getElementById('lucro-total').className = 'stat-value';
    document.getElementById('ops-pos').textContent = '0';
    document.getElementById('melhor-trade').textContent = '—';
    return;
  }

  let lucroTotal = 0, opsPos = 0, melhor = null;
  tbody.innerHTML = ops.map(op => {
    const lucro = (op.preco_venda - op.preco_compra) * op.quantidade;
    lucroTotal += lucro;
    if (lucro > 0) opsPos++;
    if (!melhor || lucro > melhor.lucro) melhor = { ticker: op.ticker, lucro };
    const pos = lucro >= 0;
    const dataFmt = op.data.split('-').reverse().join('/');
    return `<tr>
      <td class="ticker">${tickerLogoHTML(op.ticker)}</td>
      <td>${op.quantidade}</td>
      <td>R$ ${parseFloat(op.preco_compra).toFixed(2).replace('.',',')}</td>
      <td>R$ ${parseFloat(op.preco_venda).toFixed(2).replace('.',',')}</td>
      <td class="${pos?'lucro-pos':'lucro-neg'}">${fmt(lucro)}</td>
      <td><span class="badge ${pos?'pos':'neg'}">${pos?'▲ Lucro':'▼ Prejuízo'}</span></td>
      <td style="color:var(--muted)">${dataFmt}</td>
      <td><button class="btn-del" onclick="remover('${op.id}')">✕</button></td>
    </tr>`;
  }).join('');

  document.getElementById('total-ops').textContent = ops.length;
  document.getElementById('ops-pos').textContent = opsPos;
  const elLucro = document.getElementById('lucro-total');
  elLucro.textContent = fmt(lucroTotal);
  elLucro.className = 'stat-value ' + (lucroTotal >= 0 ? 'green' : 'red');
  document.getElementById('melhor-trade').textContent = melhor ? `${melhor.ticker} ${fmt(melhor.lucro)}` : '—';
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Init
sb.auth.getSession().then(({ data }) => {
  if (data.session) entrarNoApp(data.session.user);
});

document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key==='Enter') handleAuth(); });
document.getElementById('ticker').addEventListener('keydown', e => { if (e.key==='Enter') adicionarOp(); });
</script>
</body>
</html>
