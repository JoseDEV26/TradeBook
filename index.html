<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeBook</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
--bg:#080c14;
--surface:#0f1623;
--surface2:#161e2e;
--border:#1e2d45;
--accent:#00e5a0;
--accent2:#0ea5e9;
--red:#f43f5e;
--text:#e2e8f0;
--muted:#64748b;
--radius:14px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
background:var(--bg);
color:var(--text);
font-family:'Sora',sans-serif;
min-height:100vh;
}

.glow-bg{
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(ellipse 600px 400px at 20% 10%, rgba(0,229,160,0.05) 0%, transparent 70%),
radial-gradient(ellipse 500px 400px at 80% 80%, rgba(14,165,233,0.05) 0%, transparent 70%);
}

/* AUTH */

#auth-screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

.auth-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:48px 40px;
width:100%;
max-width:420px;
}

.auth-logo{
display:flex;
align-items:center;
gap:14px;
margin-bottom:32px;
}

.auth-logo-icon{
width:52px;
height:52px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
}

.auth-tabs{
display:flex;
background:var(--surface2);
border-radius:10px;
padding:4px;
margin-bottom:20px;
}

.auth-tab{
flex:1;
padding:9px;
text-align:center;
font-size:13px;
font-weight:600;
color:var(--muted);
cursor:pointer;
border-radius:8px;
border:none;
background:none;
}

.auth-tab.active{
background:var(--surface);
color:var(--text);
}

.auth-field{
margin-bottom:16px;
}

.auth-field label{
font-size:11px;
color:var(--muted);
text-transform:uppercase;
letter-spacing:.8px;
}

.auth-field input{
width:100%;
background:var(--surface2);
border:1px solid var(--border);
border-radius:10px;
padding:12px;
color:var(--text);
}

.btn-auth{
width:100%;
padding:13px;
background:linear-gradient(135deg,var(--accent),#00c47e);
border:none;
border-radius:10px;
color:#080c14;
font-weight:700;
cursor:pointer;
}

/* seletor tema */

.theme-picker{
margin-bottom:20px;
}

.theme-picker select{
width:100%;
margin-top:6px;
background:var(--surface2);
border:1px solid var(--border);
padding:10px;
border-radius:8px;
color:var(--text);
font-family:Sora;
}

</style>
</head>

<body>

<div class="glow-bg"></div>

<div id="auth-screen">

<div class="auth-card">

<div class="auth-logo">
<div class="auth-logo-icon">📒</div>
<div>
<h1>Trade<span style="color:var(--accent)">Book</span></h1>
<p style="font-size:12px;color:var(--muted)">Seu diário de operações</p>
</div>
</div>

<div class="auth-tabs">
<button class="auth-tab active">Entrar</button>
<button class="auth-tab">Criar conta</button>
</div>

<!-- seletor tema -->

<div class="theme-picker">

<label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">
Tema da interface
</label>

<select id="theme-select" onchange="changeTheme(this.value)">

<option value="green">Verde</option>
<option value="blue">Azul</option>
<option value="purple">Roxo</option>
<option value="gold">Dourado</option>
<option value="red">Vermelho</option>

</select>

</div>

<div class="auth-field">
<label>Email</label>
<input type="email">
</div>

<div class="auth-field">
<label>Senha</label>
<input type="password">
</div>

<button class="btn-auth">Entrar</button>

</div>
</div>

<script>

function changeTheme(theme){

const root=document.documentElement

const themes={

green:{
accent:"#00e5a0",
accent2:"#0ea5e9"
},

blue:{
accent:"#3b82f6",
accent2:"#06b6d4"
},

purple:{
accent:"#8b5cf6",
accent2:"#ec4899"
},

gold:{
accent:"#f59e0b",
accent2:"#fbbf24"
},

red:{
accent:"#ef4444",
accent2:"#f43f5e"
}

}

if(!themes[theme])return

root.style.setProperty('--accent',themes[theme].accent)
root.style.setProperty('--accent2',themes[theme].accent2)

localStorage.setItem("tradebook-theme",theme)

}

const savedTheme=localStorage.getItem("tradebook-theme")

if(savedTheme){

changeTheme(savedTheme)

const select=document.getElementById("theme-select")

if(select)select.value=savedTheme

}

</script>

</body>
</html>
